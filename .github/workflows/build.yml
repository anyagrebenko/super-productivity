name: Build and Package

on:
  push:
    tags:
      - 'v*' # triggered on tag push (e.g., v1.0.0)

jobs:
  # ---------- LINUX BUILD (your existing debian build) ----------
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build for Linux
        run: |
          # Place your Linux build commands here
          echo "Building Linux version..."
          # e.g.: make build
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: myapp-linux
          path: ./path/to/your/binary

  # ---------- macOS ARM BUILD ----------
  build-macos-arm:
    runs-on: macos-14 # native Apple Silicon runner
    steps:
      - uses: actions/checkout@v4

      # Install any required dependencies
      - name: Install dependencies
        run: |
          # Example: if you need Node.js for create-dmg
          brew install node

      # Build your app specifically for arm64
      - name: Build app for arm64
        run: |
          # Replace with your actual build command, explicitly targeting ARM
          # Example for Rust:
          # rustup target add aarch64-apple-darwin
          # cargo build --release --target aarch64-apple-darwin
          #
          # Example for Go:
          # GOOS=darwin GOARCH=arm64 go build -o MyApp .
          #
          # Example for Xcode project:
          # xcodebuild archive -scheme YourApp -archivePath YourApp.xcarchive -destination 'generic/platform=macOS'
          # xcodebuild -exportArchive -archivePath YourApp.xcarchive -exportPath . -exportOptionsPlist ExportOptions.plist
          echo "Building ARM version..."

      # Create the .dmg package using our script
      - name: Create .dmg
        run: |
          chmod +x ./scripts/create-dmg.sh
          ./scripts/create-dmg.sh

      # Upload the resulting .dmg as an artifact
      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: myapp-macos-arm64
          path: ./*.dmg

      # (Optional) Automatically attach the .dmg to a GitHub Release
      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
