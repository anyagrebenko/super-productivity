name: Build macOS ARM64 DMG

on:
  workflow_dispatch:

jobs:
  build:
    name: Build DMG ARM64
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run buildFrontend:prod:es6

      - name: Build Electron
        run: npm run electron:build

      - name: Build DMG
        run: npx electron-builder --mac dmg --arm64

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: super-productivity-macos-arm64
          path: dist/*.dmg
